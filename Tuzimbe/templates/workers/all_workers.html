{% extends '../base.html' %}
{% block content %}
<h3>ALL WORKERS</h3>
<div class="container">
    
    <table class="table" id="all_workers">
        <thead>
            <tr>
                <th>First name</th>
                <th>Last name</th>
                <th>Phone number</th>
                <th>Email</th>
                <th>Details</th>
                <th>Update</th>
                <th>Delete</th>
                
                
            </tr>
        </thead>
        <tbody>
            {% for worker in workers %}
                <tr>
                    <td>{{ worker.first_name }}</td>
                    <td>{{ worker.last_name }}</td>
                    <td>{{ worker.phone_number }}</td>
                    <td>{{ worker.email }}</td>
                    <td><a href="{% url 'Tuzimbe:worker_details' worker.id %}" class="btn btn-primary">Details</a></td>
                    <td><a href="{% url 'Tuzimbe:update_workers' worker.id %}" class="btn btn-primary">Update</a></td>
                    <td>
                        <a href="{% url 'Tuzimbe:delete_workers' pk=worker.pk %}" class="btn btn-danger"
                        onclick="return confirm('Are you sure you want to delete this worker?');">Delete</a>

                    </td>
                    
                </tr>
            {% endfor %}
        </tbody>
    </table>
   
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


<script src="https://cdn.datatables.net/2.1.3/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/autofill/2.7.0/js/dataTables.autoFill.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.1.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.1.1/js/buttons.colVis.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.1.1/js/buttons.print.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.1.1/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/responsive/3.0.2/js/dataTables.responsive.min.js"></script>

<script>
    $(document).ready(function() {
        $('#all_workers').DataTable({
            "paging": true,        
            "searching": true,     
            "ordering": true,      
            "pageLength": 5       
        });
    });
</script>
{% endblock %}
