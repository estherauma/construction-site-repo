{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tuzimbe{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static "css/base.css" %}" />
    <link rel="stylesheet" href="{% static "css/forms.css" %}" />
    <link rel="stylesheet" href="{% static "css/details.css" %}" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.3/css/dataTables.dataTables.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/autofill/2.7.0/css/autoFill.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/3.1.1/css/buttons.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/3.0.2/css/responsive.dataTables.min.css" />

</head>
<body>
    <nav class="navbar navbar-expand-lg" style="background-color: #9394b5">
        <div class="container-fluid" style="margin-left: 20px; font-family: 'Robot'; ">
          <a class="navbar-brand" style="font-size:35px;" href="{% url 'Tuzimbe:index' %}">Tuzimbe</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
        <div class="d-flex" style="margin-right: 50px; font-family: 'Robot'; font-size: 20px; padding: 10px;">
          <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Workers
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Add Workers</a></li>
                  <li><a class="dropdown-item" href="#">All Workers</a></li>
                </ul>
              </li>
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Materials
                </a>
                <ul class="dropdown-menu">
                  <li><a class="dropdown-item" href="#">Add Materials</a></li>
                  <li><a class="dropdown-item" href="#">All Materials</a></li>
                  <li><a class="dropdown-item" href="#">Use Materials</a></li>
                </ul>
              </li>
            </ul>
          </div>
        </div>
    </nav>
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var dropdown = document.querySelectorAll('.dropdown-btn');
        dropdown.forEach(function(btn) {
            btn.addEventListener('click', function() {
                this.classList.toggle('active');
                var dropdownContent = this.nextElementSibling;
                if (dropdownContent.style.display === "block") {
                    dropdownContent.style.display = "none";
                } else {
                    dropdownContent.style.display = "block";
                }
            });
        });
    });
    </script>
