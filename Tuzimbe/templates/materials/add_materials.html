{% extends "../base.html" %}
{% block content %}
<div class="form-container">
    <form method="post" id="form" class="materials_form">
        {% if error_message %}
        <div class="alert alert-danger" role="alert">
            {{ error_message }}
        </div>
        {% endif %}
        <h1>Fill out the form to Add Materials</h2>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add</button>
    </form>
</div>


{% endblock %}
