{% extends '../base.html' %}
{% block content %}
<div class="card">
    <h2>Edit Material: {{material.name}}</h2>
    {% if error_message %}
        <div class="alert alert-danger" role="alert">
            {{ error_message }}
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-secondary">Update</button>
    </form>
</div>
{% endblock %}
